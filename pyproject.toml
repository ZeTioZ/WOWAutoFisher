[project]
name = "autofisher"
version = "0.1.0"
description = "WASAPI fishing splash detector"
requires-python = "==3.14.*"
dependencies = [
    "numpy>=2.0",
    "PyAutoGUI>=0.9.54",
    "PyAudioWPatch>=0.2.12",
    "SoundFile>=0.13",
    "SciPy>=1.14",
    "typer>=0.29.2",
]

[project.scripts]
autofisher = "autofisher.cli.app:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyinstaller>=6.17",
    "pyrefly>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autofisher"]

[tool.hatch.build.targets.wheel.force-include]
"sounds" = "autofisher/sounds"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "PIE", "PLE", "PLW", "RUF", "SIM", "UP"]
ignore = ["D107", "D203", "D213", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["autofisher"]

[tool.pyrefly]
project-includes = ["autofisher/**/*.py", "tests/**/*.py"]
python-version = "3.14"
preset = "strict"
check-unannotated-defs = true
infer-return-types = "never"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-config",
    "--strict-markers",
    "--cov=autofisher",
    "--cov-report=term-missing",
]
filterwarnings = ["error"]

[tool.pyrefly.errors]
redundant-cast = "error"
unannotated-return = "error"
unused-ignore = "error"

[tool.coverage.run]
branch = true
source = ["autofisher"]

[tool.coverage.report]
show_missing = true
fail_under = 100
